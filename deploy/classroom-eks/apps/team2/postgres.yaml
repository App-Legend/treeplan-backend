# team2 전용 PostgreSQL 16. 앱(treeplan.yaml)이 DB_URL 로 붙는다.
# 비밀번호를 git 에 두지 않으려고, team namespace 에 이미 있는 mysql-auth 시크릿의 사용자명·비밀번호를 초기 계정으로 쓴다.
# 데이터는 classroom-gp3 디스크에 남고, ArgoCD 앱을 지워도 지워지지 않게 Prune=false,Delete=false 를 붙인다 (교수님 mysql 과 같은 설정).
apiVersion: v1
kind: Service
metadata:
  name: treeplan-team2-postgres
spec:
  clusterIP: None
  selector:
    app: treeplan-team2-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: treeplan-team2-postgres
  annotations:
    # 앱보다 먼저 만든다
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  replicas: 1
  serviceName: treeplan-team2-postgres
  selector:
    matchLabels:
      app: treeplan-team2-postgres
  template:
    metadata:
      labels:
        app: treeplan-team2-postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: seokkeobom
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-auth
                  key: MYSQL_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-auth
                  key: MYSQL_PASSWORD
            # 새 디스크의 맨 위에는 lost+found 가 있어 initdb 가 거부하므로 하위 폴더를 쓴다
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: postgres
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations:
          argocd.argoproj.io/sync-options: Prune=false,Delete=false
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: classroom-gp3
        resources:
          requests:
            storage: 5Gi
