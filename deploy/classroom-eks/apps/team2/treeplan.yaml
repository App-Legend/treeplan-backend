# team2 (TreePlan) EKS 배포 명세. ArgoCD 앱 classroom-team2 가 이 폴더를 읽어 자동 배포한다.
# 이미지: main 에 머지하면 deploy.yml 이 ECR idea-support-server2:latest 로 올린다. Image Updater 는 없으니 ArgoCD 에서 Deployment 를 Restart 하면 새 이미지로 바뀐다.
# DB: 같은 폴더의 postgres.yaml 로 띄우는 team2 전용 PostgreSQL 에 DB_URL 로 붙는다.
#     계정은 team namespace 의 mysql-auth 시크릿을 같이 쓴다 (postgres.yaml 이 같은 값으로 초기화). spring-auth 시크릿도 team 에만 있어 team namespace 에 배포한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: treeplan-team2
spec:
  replicas: 1
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 300
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: treeplan-team2
  template:
    metadata:
      labels:
        app: treeplan-team2
    spec:
      automountServiceAccountToken: false
      containers:
        - name: spring
          image: 950177940921.dkr.ecr.ap-southeast-2.amazonaws.com/idea-support-server2:latest
          # Image Updater 가 없어서, Deployment 를 재시작하면 ECR latest 를 새로 받도록 Always
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: DB_URL
              value: jdbc:postgresql://treeplan-team2-postgres:5432/seokkeobom
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-auth
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-auth
                  key: MYSQL_PASSWORD
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "3"
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=70.0 -Dfile.encoding=UTF-8
            # GEMINI_API_KEY 를 넣지 않으면 AI 는 예시(mock) 모드로 돈다
          envFrom:
            - secretRef:
                name: spring-auth
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # 앱은 /api 아래에서 돌지만 /common/health 도 루트에서 받는다 (RootHealthPathConfig)
          startupProbe:
            httpGet:
              path: /common/health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /common/health
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: treeplan-team2
spec:
  selector:
    app: treeplan-team2
  ports:
    - name: http
      port: 80
      targetPort: http
