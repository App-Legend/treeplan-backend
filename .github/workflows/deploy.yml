name: Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AWS_REGION: ap-southeast-2
  ECR_REGISTRY: 950177940921.dkr.ecr.ap-southeast-2.amazonaws.com
  ECR_REPOSITORY: idea-support-server2

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: idea_support_test
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      IDEA_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/idea_support_test
      IDEA_TEST_DB_USER: ci_user
      IDEA_TEST_DB_PASSWORD: ci_password

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Grant execute permission for Gradlew
        run: chmod +x ./gradlew

      - name: Check code style and run tests
        run: ./gradlew ktlintCheck test

  build_and_push:
    name: Build and Push Docker Image
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Grant execute permission for Gradlew
        run: chmod +x ./gradlew

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and Push Image with Jib
        env:
          REGISTRY_USER: AWS
          CONTAINER_IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
        run: |
          export REGISTRY_PASSWORD=$(aws ecr get-login-password --region $AWS_REGION)
          ./gradlew jib -PprojectDataImageTargetEnv=prod