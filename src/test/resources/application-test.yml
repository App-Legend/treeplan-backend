spring:
  datasource:
    # CI는 deploy.yml의 PostgreSQL 서비스를, 로컬은 H2를 쓴다
    url: ${IDEA_TEST_JDBC_URL:jdbc:h2:mem:test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${IDEA_TEST_DB_USER:sa}
    password: ${IDEA_TEST_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: create-drop
app:
  ai:
    gemini-api-key: ""
